main: com.defspacemine.snapshotpve.SnapshotPvePlugin
name: SnapshotPvePlugin
version: 1.0.0
api-version: "26.2"
author: defSpaceMine
description: The SnapshotPve Plugin!

commands:
  pvecheckpoint:
    description: Broadcast a styled prompt with default Yes/No choices or customizable options.
    usage: >-
      /pvecheckpoint <delayTicks> <color> <style|NONE> <sound|NONE> <volume> <pitch>
      [option=<label>%<color>%<style|NONE>%<command...> ...]
      message=<dialogue...> [target=<selector>] [scope=PLAYER|EVERYONE]
      Or use legacy yes=<command...> no=<command...> before message= for the default Yes/No options.
      Example: /pvecheckpoint 40 GOLD BOLD UI_BUTTON_CLICK 0.8 1.2 yes=tp %player% 0 64 0 no=- message=Continue to the checkpoint scope=PLAYER
      Example: /pvecheckpoint 40 GOLD BOLD UI_BUTTON_CLICK 0.8 1.2 option=Enter%GREEN%BOLD%tp %player% 120 64 -30 option=Wait%YELLOW%ITALIC%- option=Leave%RED%STRIKETHROUGH%tp %player% 0 64 0 message=Choose your path target=@p scope=PLAYER
      Repeat option= at least once to define custom choices. Each option has its own label, named color, style, and command; use - for no action. Without options or legacy yes=/no= callbacks, Yes and No default to no action. By default, only players tagged playingPVE or spectatingPVE receive it. target= accepts selectors such as @a[tag=joiningPVE]; scope=PLAYER lets each recipient choose independently, while EVERYONE lets the first recipient choose for all.
  pveprologuedialogue:
    description: Send colored PVE prologue dialogue to tagged PVE players by default, or a selector; supports appended text and sound settings.
    usage: >-
      /pveprologuedialogue <delayTicks> <color> <sound|NONE> <volume> <pitch>
      <message...> [append=<color> <style|NONE> <text...>] [target=<selector>]
      Example: /pveprologuedialogue 40 RED NONE 1 1 The door opens target=@p
      Example: /pveprologuedialogue 40 RED NONE 1 1 The door opens append=GOLD BOLD and the path is clear target=@a[tag=joiningPVE]
      Without target=, recipients are players tagged playingPVE or spectatingPVE. Selectors resolve in the command sender's context and may include @a, @p, @r, or @e with tag filters.
  pvedefdialogue:
    description: Send colored PVE dialogue with the defSpaceMine prefix and configurable sound volume and pitch.
    usage: /pveDefDialogue <delayTicks> <color> <sound|NONE> <volume> <pitch> <message...>
  pvesummon:
    description: Summon a mob with weighted or sequential dialogue for player interactions.
    usage: >-
      /pvesummon <mob> <x> <y> <z> [<snbt>|-]
      [<color>%<style>%<weight>%<text>[|sound=<sound|NONE>[%<volume>%<pitch>]],...|sequence=PLAYER <sequence-lines>|sequence=PLAYINGPVE <sequence-lines>]
      Sequence line: <color>%<style>%<delayTicks>%<text>[|sound=<sound|NONE>[%<volume>%<pitch>]][|append=<color>%<style>%<text>][|check=<prompt> ...]
      A check accepts legacy |yes=<command>|no=<command> callbacks, or one or more |option=<label>%<color>%<style|NONE>%<command...> entries.
    permission: snapshotpve.summon
  setpvelevel:
    description: Set and persist the level tracked for the current PVE lobby instance.
    usage: /setPveLevel <level 1-20> [pveWorld]
    permission: snapshotpve.setlevel
  startpvelevel:
    description: Start the selected level for the current PVE lobby instance.
    usage: /startPveLevel [pveWorld]
    permission: snapshotpve.startlevel
  setpvepvp:
    description: Enable or disable PvP in all loaded PVE lobby dimension worlds.
    usage: /setpvepvp <true|false>

permissions:
  snapshotpve.summon:
    description: Allows summoning mobs with custom dialogue.
    default: op
  snapshotpve.setpvp:
    description: Allows changing PvP in PVE lobby dimension worlds.
    default: op

dependencies:
  server:
    FastAsyncWorldEdit:
      load: BEFORE
      required: true
      join-classpath: true
    SnapshotPvpPlugin:
      load: BEFORE
      required: true
      join-classpath: true
